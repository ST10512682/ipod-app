name: Build DriveDeck
on:
  push:
    paths:
      - 'drivedeck/**'
      - '.github/workflows/build-drivedeck.yml'
    tags:
      - 'dd-v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - run: gradle -p drivedeck assembleDebug --no-daemon --stacktrace
      - run: cp drivedeck/app/build/outputs/apk/debug/app-debug.apk drivedeck.apk
      - uses: actions/upload-artifact@v4
        with:
          name: drivedeck-apk
          path: drivedeck.apk
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/dd-v')
        with:
          files: drivedeck.apk
