name: Build DriveDeck
on:
  push:
    branches: ['**']
    paths:
      - 'drivedeck/**'
      - '.github/workflows/build-drivedeck.yml'
    tags:
      - 'dd-v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: Build
        run: |
          set +e
          gradle -p drivedeck assembleDebug --no-daemon --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            { grep -E "^e: " build.log | head -8; grep -A5 "What went wrong" build.log | head -8; } | while IFS= read -r l; do
              l="${l//%/%25}"; echo "::error::${l:0:900}"
            done
          fi
          exit $code
      - run: cp drivedeck/app/build/outputs/apk/debug/app-debug.apk drivedeck.apk
      - uses: actions/upload-artifact@v4
        with:
          name: drivedeck-apk
          path: drivedeck.apk
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/dd-v')
        with:
          files: drivedeck.apk
