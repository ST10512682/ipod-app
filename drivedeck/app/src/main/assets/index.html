<!DOCTYPE html>
<html lang="en" data-lamp="amber"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>DriveDeck</title>
<style>
:root{--lamp:#ffb000;--lampd:#6b4700;--hx:0px;--hy:0px;--hw:0px;--hh:0px}
html[data-lamp=green]{--lamp:#62ff80;--lampd:#1c6b2c}
html[data-lamp=ice]{--lamp:#86dcff;--lampd:#1b566e}
html[data-lamp=red]{--lamp:#ff6450;--lampd:#6e2218}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:transparent;color:var(--lamp);font-family:"Courier New",Courier,monospace;touch-action:manipulation}
.bg{position:absolute;inset:0;background:radial-gradient(120% 90% at 30% 0%,#50535a,#292b30 55%,#141517);
 -webkit-mask-image:linear-gradient(#000,#000),linear-gradient(#000,#000);
 -webkit-mask-size:100% 100%,var(--hw) var(--hh);-webkit-mask-position:0 0,var(--hx) var(--hy);-webkit-mask-repeat:no-repeat;
 -webkit-mask-composite:xor;mask-composite:exclude}
.bg::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);pointer-events:none}
.plate{position:absolute;inset:0;padding:2.4vh 1.6vw;display:grid;grid-template-columns:17vw 1fr 31vw;grid-template-rows:1fr 25vh;gap:2.4vh 1.6vw}
/* knob */
.kcell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vh;color:#cfd2d8;font-size:1.9vh;letter-spacing:.2em}
.knob{position:relative;width:min(15vw,36vh);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#6a6d74,#2a2b2f 60%,#121315);box-shadow:0 .6vh 1.6vh #000c,inset 0 0 0 .5vh #1a1b1d,inset 0 0 0 .7vh #55585f;touch-action:none}
.kface{position:absolute;inset:9%;border-radius:50%;background:repeating-conic-gradient(#3b3d42 0 4deg,#17181a 4deg 8deg);box-shadow:inset 0 0 1.4vh #000;transition:transform .12s}
.kface::before{content:"";position:absolute;left:46%;top:5%;width:8%;height:22%;border-radius:1vh;background:var(--lamp);box-shadow:0 0 1.2vh var(--lamp)}
.kface::after{content:"";position:absolute;inset:22%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7a7d84,#26272a)}
.vol{font-size:3.4vh;color:var(--lamp);text-shadow:0 0 1vh var(--lamp);letter-spacing:.1em}
/* display */
.disp{position:relative;background:#0a0704;border-radius:1.6vh;box-shadow:inset 0 0 3vh #000,0 0 0 .5vh #000,0 0 0 .8vh #5b5e65;padding:1.6vh 1.4vw;display:flex;flex-direction:column;gap:.8vh;overflow:hidden;color:var(--lamp);text-shadow:0 0 .9vh var(--lamp);min-height:0}
.disp::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.1),transparent 34%);pointer-events:none}
.row{display:flex;justify-content:space-between;font-size:2.1vh;letter-spacing:.12em;opacity:.9}
.title{font-size:4.2vh;font-weight:700;letter-spacing:.06em;white-space:nowrap;overflow:hidden}
.title span{display:inline-block;padding-right:6vw}
.title.scroll span{animation:mq 14s linear infinite}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.sub{font-size:2.3vh;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:2.8vh}
.dial{position:relative;height:6.2vh;margin-top:.4vh;border-top:1px solid var(--lampd);border-bottom:1px solid var(--lampd);background:repeating-linear-gradient(90deg,var(--lampd) 0 1px,transparent 1px 2%)}
.dial::before{content:"";position:absolute;inset:0 0 50% 0;background:repeating-linear-gradient(90deg,var(--lamp) 0 1px,transparent 1px 10%);opacity:.7}
.nums{position:absolute;left:0;right:0;bottom:.2vh;display:flex;justify-content:space-between;font-size:1.6vh;opacity:.8;padding:0 .3vw}
.needle{position:absolute;top:-.8vh;bottom:-.8vh;left:0;width:.45vh;background:#ff3b30;box-shadow:0 0 1vh #ff3b30;transition:left .6s linear}
.spec{flex:1;min-height:0;width:100%}
.disp.boot .title,.disp.boot .sub,.disp.boot .row{animation:bootf 1.6s steps(8) 1}
@keyframes bootf{0%{opacity:0}50%{opacity:.2}100%{opacity:1}}
/* camera */
.camwrap{position:relative;display:flex;flex-direction:column;padding:0 1.9vh;min-height:0}
.camlbl{display:flex;justify-content:space-between;align-items:center;font-size:1.9vh;letter-spacing:.22em;margin-bottom:3vh;color:#c9ccd3}
.led{display:inline-block;width:1.6vh;height:1.6vh;border-radius:50%;background:#3a1110;margin-right:.6vw;vertical-align:middle}
.rec .led{background:#ff2a1f;box-shadow:0 0 1.2vh #ff2a1f;animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}
#cam{position:relative;flex:1;min-height:0;border-radius:.6vh;box-shadow:0 0 0 .5vh #000,0 0 0 1.5vh #17181a,0 0 0 1.8vh #4a4d54,0 0 0 2.1vh #000}
#camtxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:2vh;color:var(--lamp);opacity:.85;padding:1vw}
.reels{display:flex;justify-content:space-between;margin-top:3.2vh;padding:0 6%}
.reel{width:3.6vh;height:3.6vh;border-radius:50%;background:radial-gradient(circle,#0b0b0c 0 22%,#cfcfd2 23% 30%,#0b0b0c 31% 42%,#8d9096 43% 50%,#111 51%);position:relative}
.reel::after{content:"";position:absolute;inset:10%;border-radius:50%;background:conic-gradient(transparent 0 20deg,#cfcfd2 20deg 40deg,transparent 40deg 140deg,#cfcfd2 140deg 160deg,transparent 160deg 260deg,#cfcfd2 260deg 280deg,transparent 280deg)}
.rec .reel{animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* buttons */
.keys{grid-column:1/4;display:flex;align-items:stretch;gap:.9vw}
.grp{display:flex;gap:.6vw;flex:1}
.sep{width:.25vw;background:linear-gradient(#0008,#fff2);border-radius:1px;margin:1vh 0}
.btn{flex:1;min-width:0;border:0;border-radius:1.4vh;background:linear-gradient(#53565d,#2a2b2f);box-shadow:inset 0 .25vh #fff4,0 .5vh 1vh #000c,0 0 0 .3vh #0b0b0c;color:#e3e5ea;font-family:inherit;font-weight:700;font-size:2.6vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4vh;padding:0}
.btn small{font-size:1.5vh;color:var(--lamp);text-shadow:0 0 .8vh var(--lamp);letter-spacing:.12em}
.btn:active,.btn.on{background:linear-gradient(#2a2b2f,#3f4147);box-shadow:inset 0 .4vh 1vh #000,0 0 0 .3vh #0b0b0c;transform:translateY(.2vh)}
.btn.lamp{color:var(--lamp);text-shadow:0 0 1vh var(--lamp)}
.btn.rec{color:#ff6a5e}
.btn .dot{width:1vh;height:1vh;border-radius:50%;background:#2c2c2e}
.btn .dot.set{background:var(--lamp);box-shadow:0 0 .8vh var(--lamp)}
.flash{animation:fl .4s steps(2) 4}
@keyframes fl{50%{filter:brightness(2.2)}}
/* panels */
.panel{position:absolute;inset:3vh 4vw;background:#101113;border:1px solid var(--lampd);border-radius:2vh;box-shadow:0 0 0 .5vh #000,0 2vh 6vh #000;display:none;flex-direction:column;z-index:50}
.panel.open{display:flex}
.ph{display:flex;justify-content:space-between;align-items:center;padding:1.6vh 2vw;border-bottom:1px solid var(--lampd);font-size:2.8vh;letter-spacing:.2em}
.ph button{background:#2b2c30;color:#fff;border:0;border-radius:1.2vh;font:inherit;font-size:2.6vh;padding:1vh 2vw}
.pb{flex:1;overflow:auto;padding:1.2vh 2vw;-webkit-overflow-scrolling:touch}
.item{display:flex;align-items:center;gap:1.2vw;padding:1.3vh .6vw;border-bottom:1px solid #26282b;font-size:2.5vh;color:#e6e8ec}
.item .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .m{font-size:1.9vh;color:#8d9097}
.item button{background:#2b2c30;color:#fff;border:0;border-radius:1vh;font:inherit;font-size:2.4vh;padding:1vh 1.4vw;min-width:6vh}
.item button.warn{background:#7a2018}
.lk{color:#ff6a5e}
.opt{display:flex;align-items:center;gap:1vw;padding:1.2vh 0;font-size:2.5vh;color:#e6e8ec;border-bottom:1px solid #26282b}
.opt label{width:24vw;color:#aab}
.seg{display:flex;gap:.6vw;flex:1}
.seg button{flex:1;background:#2b2c30;color:#ddd;border:0;border-radius:1vh;font:inherit;font-size:2.3vh;padding:1.1vh 0}
.seg button.on{background:var(--lamp);color:#111;font-weight:700}
.note{font-size:1.9vh;color:#8d9097;padding-top:1vh}
</style></head><body>
<div class="bg" id="bg"></div>
<div class="plate">
  <div class="kcell">
    <div class="knob" id="knob"><div class="kface" id="kface"></div></div>
    <div class="vol" id="vol">80</div><div>VOLUME</div>
  </div>
  <div class="disp boot" id="disp">
    <div class="row"><span id="trk">TRK --/--</span><span id="clock">--:--</span><span id="recind"></span></div>
    <div class="title" id="titlebox"><span id="title">NO MUSIC FOUND</span></div>
    <div class="sub" id="sub"></div>
    <div class="dial"><div class="nums"><span id="n0">0:00</span><span id="n1"></span><span id="n2"></span><span id="n3"></span><span id="n4"></span></div><div class="needle" id="needle"></div></div>
    <canvas class="spec" id="spec"></canvas>
  </div>
  <div class="camwrap" id="camwrap">
    <div class="camlbl"><span><i class="led"></i><span id="camst">STBY</span></span><span id="storage">--</span></div>
    <div id="cam"><div id="camtxt"></div></div>
    <div class="reels"><div class="reel"></div><div class="reel"></div></div>
  </div>
  <div class="keys">
    <div class="grp" id="presets"></div>
    <div class="sep"></div>
    <div class="grp">
      <button class="btn" id="bPrev">&#9198;<small>PREV</small></button>
      <button class="btn lamp" id="bPlay">&#9654;<small>PLAY</small></button>
      <button class="btn" id="bNext">&#9197;<small>NEXT</small></button>
    </div>
    <div class="sep"></div>
    <div class="grp">
      <button class="btn" id="bLock">&#128274;<small>LOCK</small></button>
      <button class="btn rec" id="bRec">&#9679;<small>REC</small></button>
      <button class="btn" id="bLib">&#9835;<small>LIB</small></button>
      <button class="btn" id="bClips">&#9638;<small>CLIPS</small></button>
      <button class="btn" id="bSet">&#9881;<small>SET</small></button>
    </div>
  </div>
</div>
<div class="panel" id="panel"><div class="ph"><span id="ptitle"></span><button id="pclose">CLOSE</button></div><div class="pb" id="pbody"></div></div>
<script>
const A=window.Android;
const $=id=>document.getElementById(id);
const J=(f,d)=>{try{return JSON.parse(f())}catch(e){return d}};
let st={music:{}},volPct=80,booted=false;
const fmt=s=>{s=Math.max(0,s|0);return(s/60|0)+':'+String(s%60).padStart(2,'0')};
const hms=s=>{s=s|0;return String(s/3600|0).padStart(2,'0')+':'+String(s/60%60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
/* hole for the live camera */
function layout(){const r=$('cam').getBoundingClientRect();
 const s=document.documentElement.style;s.setProperty('--hx',r.left+'px');s.setProperty('--hy',r.top+'px');s.setProperty('--hw',r.width+'px');s.setProperty('--hh',r.height+'px');
 A.setPreview(r.left,r.top,r.width,r.height);
 const c=$('spec'),d=window.devicePixelRatio||1;c.width=c.clientWidth*d;c.height=c.clientHeight*d}
addEventListener('resize',()=>setTimeout(layout,60));
/* knob */
const knob=$('knob');let dragging=false;
function setVol(p,send){volPct=Math.max(0,Math.min(100,p));$('kface').style.transform='rotate('+(-135+volPct*2.7)+'deg)';$('vol').textContent=String(Math.round(volPct)).padStart(2,'0');if(send)A.setVol(volPct/100)}
function drag(e){const r=knob.getBoundingClientRect();let a=Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))*180/Math.PI+90;if(a>180)a-=360;a=Math.max(-135,Math.min(135,a));setVol((a+135)/2.7,true)}
knob.addEventListener('pointerdown',e=>{dragging=true;knob.setPointerCapture(e.pointerId);drag(e)});
knob.addEventListener('pointermove',e=>{if(dragging)drag(e)});
knob.addEventListener('pointerup',()=>dragging=false);knob.addEventListener('pointercancel',()=>dragging=false);
/* presets: tap = play, hold = store current song */
const pre=$('presets');
for(let n=1;n<=6;n++){const b=document.createElement('button');b.className='btn';b.innerHTML='<span class="dot" id="pd'+n+'"></span>'+n+'<small>PRESET</small>';
 let timer=0,held=false;
 b.addEventListener('pointerdown',()=>{held=false;timer=setTimeout(()=>{held=true;const id=st.music&&st.music.id;if(id>0){localStorage.setItem('p'+n,id);b.classList.add('flash');setTimeout(()=>b.classList.remove('flash'),1700);marks()}},700)});
 b.addEventListener('pointerup',()=>{clearTimeout(timer);if(!held){const id=+localStorage.getItem('p'+n);if(id)A.playId(id)}});
 b.addEventListener('pointercancel',()=>clearTimeout(timer));pre.appendChild(b)}
function marks(){for(let n=1;n<=6;n++)$('pd'+n).classList.toggle('set',!!localStorage.getItem('p'+n))}
/* transport */
$('bPlay').onclick=()=>A.toggle();$('bNext').onclick=()=>A.next();$('bPrev').onclick=()=>A.prev();
$('bLock').onclick=()=>{A.lockNow();$('bLock').classList.add('flash');setTimeout(()=>$('bLock').classList.remove('flash'),1700)};
$('bRec').onclick=()=>{st.rec?A.stopRec():A.startRec()};
/* state */
function poll(){st=J(()=>A.state(),st);const m=st.music||{};
 $('bPlay').firstChild.nodeValue=m.playing?'\u275A\u275A':'\u25B6';$('bPlay').querySelector('small').textContent=m.playing?'PAUSE':'PLAY';
 $('trk').textContent=m.count?('TRK '+String((m.idx|0)+1).padStart(2,'0')+'/'+String(m.count).padStart(2,'0')):'TRK --/--';
 const t=m.title||(m.count?'PRESS PLAY':'NO MUSIC FOUND');
 if($('title').textContent!==t){$('title').textContent=t;const tb=$('titlebox');tb.classList.remove('scroll');setTimeout(()=>{if($('title').scrollWidth>tb.clientWidth)tb.classList.add('scroll')},50)}
 $('sub').textContent=[m.artist,m.album].filter(Boolean).join(' - ');
 const d=(m.dur||0)/1000;$('needle').style.left=(d?Math.min(99.4,(m.pos/1000)/d*100):0)+'%';
 [1,2,3,4].forEach(i=>$('n'+i).textContent=d?fmt(d*i/4):'');
 const now=new Date();$('clock').textContent=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
 $('recind').textContent=st.rec?('\u25CF REC '+hms(st.secs)):'';
 const cw=$('camwrap');cw.classList.toggle('rec',!!st.rec);$('disp').parentNode.classList.toggle('rec',!!st.rec);
 $('camst').textContent=st.rec?'REC':'STBY';$('bRec').querySelector('small').textContent=st.rec?'STOP':'REC';
 $('storage').textContent=(st.clips||0)+' CLIPS \u00B7 '+(st.locked||0)+' LOCKED';
 $('camtxt').textContent=st.cam===false?'CAMERA ACCESS NEEDED - TAP REC':(st.rec?'':'CAMERA OFF - TAP REC');
 if(st.impact&&st.impact!==lastImpact){lastImpact=st.impact;if(booted){$('bLock').classList.add('flash');setTimeout(()=>$('bLock').classList.remove('flash'),1700);$('recind').textContent='LOCKED'}}
}
let lastImpact=0;setInterval(poll,500);
window.onNative=()=>{poll()};
/* spectrum */
const sp=$('spec'),peaks=new Array(24).fill(0),lev=new Array(24).fill(0);let tk=0,raw=[];
setInterval(()=>{const s=A.fft();raw=s?s.split(',').map(Number):[]},60);
function draw(){requestAnimationFrame(draw);const g=sp.getContext('2d'),W=sp.width,H=sp.height;g.clearRect(0,0,W,H);
 const cs=getComputedStyle(document.documentElement),lamp=cs.getPropertyValue('--lamp').trim(),dim=cs.getPropertyValue('--lampd').trim();
 const playing=st.music&&st.music.playing;tk++;
 const bw=W/24,segs=10,sh=H/segs;
 for(let i=0;i<24;i++){let v;
  if(raw.length===24)v=raw[i]/255;else if(playing)v=.35+.3*Math.sin(tk/9+i*.7)+.25*Math.sin(tk/5.3+i*1.9);else v=0;
  v=Math.max(0,Math.min(1,v));lev[i]+=(v-lev[i])*(v>lev[i]?.6:.15);if(lev[i]>peaks[i])peaks[i]=lev[i];else peaks[i]=Math.max(0,peaks[i]-.008);
  const n=Math.round(lev[i]*segs),pk=Math.round(peaks[i]*segs);
  for(let s=0;s<segs;s++){const y=H-(s+1)*sh;g.fillStyle=(s<n)?(s>=segs-2?'#ff4a3a':lamp):dim;g.globalAlpha=(s<n)?1:.35;g.fillRect(i*bw+bw*.12,y+sh*.14,bw*.76,sh*.72)}
  if(pk>0){const s=Math.min(segs-1,pk);g.globalAlpha=1;g.fillStyle='#fff';g.fillRect(i*bw+bw*.12,H-(s+1)*sh+sh*.14,bw*.76,sh*.3)}}
 g.globalAlpha=1}
/* panels */
const panel=$('panel');
function open(title,html){$('ptitle').textContent=title;$('pbody').innerHTML=html;panel.classList.add('open')}
$('pclose').onclick=()=>panel.classList.remove('open');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('bLib').onclick=()=>{A.rescan();const t=J(()=>A.tracks(),[]);
 open('MUSIC LIBRARY',t.length?t.map(x=>'<div class="item" data-i="'+x.i+'"><span class="t">'+esc(x.t)+'</span><span class="m">'+esc(x.a)+'</span></div>').join(''):'<div class="note">No music found. Allow music access, then add songs to this phone.<br><br><button class="btn" id="perm" style="height:8vh;width:30vw">ALLOW ACCESS</button></div>');
 const p=$('perm');if(p)p.onclick=()=>A.requestPerms()};
$('pbody').addEventListener('click',e=>{const it=e.target.closest('.item[data-i]');if(it){A.play(+it.dataset.i);panel.classList.remove('open')}});
function clipsPanel(){const c=J(()=>A.clips(),[]);
 open('CLIPS ('+c.length+')',c.length?c.map(x=>{const d=new Date(x.time);return '<div class="item" data-n="'+esc(x.name)+'"><span class="t">'+(x.locked?'<span class="lk">\uD83D\uDD12 </span>':'')+esc(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'  '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'))+'</span><span class="m">'+Math.round(x.size/1048576)+' MB</span><button data-a="v">\u25B6</button><button data-a="l">'+(x.locked?'UNLOCK':'LOCK')+'</button><button data-a="s">SAVE</button><button data-a="d">DEL</button></div>'}).join(''):'<div class="note">No clips yet. Tap REC to start loop recording.<br>Clips are stored in this app\'s Movies/DriveDeck folder. SAVE copies one to your gallery.</div>')}
$('bClips').onclick=clipsPanel;
$('pbody').addEventListener('click',e=>{const b=e.target.closest('button[data-a]');if(!b)return;const n=b.closest('.item').dataset.n,a=b.dataset.a;
 if(a==='v')A.openClip(n);
 else if(a==='l'){A.toggleLock(n);clipsPanel()}
 else if(a==='s'){b.textContent=A.exportClip(n)?'SAVED':'FAILED'}
 else if(a==='d'){if(b.classList.contains('warn')){A.deleteClip(n);clipsPanel()}else{b.classList.add('warn');b.textContent='SURE?';setTimeout(()=>{b.classList.remove('warn');b.textContent='DEL'},2200)}}});
function seg(label,key,opts,cur,onset){return '<div class="opt"><label>'+label+'</label><div class="seg" data-k="'+key+'">'+opts.map(o=>'<button data-v="'+o[0]+'"'+(o[0]==cur?' class="on"':'')+'>'+o[1]+'</button>').join('')+'</div></div>'}
function settingsPanel(){const s=J(()=>A.settings(),{seg:3,cap:4096,mic:0,sens:1,auto:1}),lamp=localStorage.getItem('lamp')||'amber';
 open('SETTINGS',seg('CLIP LENGTH','seg',[[1,'1 MIN'],[3,'3 MIN'],[5,'5 MIN']],s.seg)+seg('STORAGE CAP','cap',[[2048,'2 GB'],[4096,'4 GB'],[8192,'8 GB'],[16384,'16 GB']],s.cap)+seg('IMPACT SENSOR','sens',[[0,'LOW'],[1,'MEDIUM'],[2,'HIGH']],s.sens)+seg('MICROPHONE','mic',[[0,'OFF'],[1,'ON']],s.mic)+seg('AUTO-RECORD ON OPEN','auto',[[0,'OFF'],[1,'ON']],s.auto)+seg('BACKLIGHT','lamp',[['amber','AMBER'],['green','GREEN'],['ice','ICE'],['red','RED']],lamp)+
 '<div class="note">Changes to clip length, microphone and sensor apply from the next recording. If you record audio, tell your passengers. Footage can contain personal information, so be careful before sharing it online. Only use the app while the phone is secured in a mount.</div>')}
$('bSet').onclick=settingsPanel;
$('pbody').addEventListener('click',e=>{const b=e.target.closest('.seg button');if(!b)return;const g=b.parentNode,k=g.dataset.k,v=b.dataset.v;
 g.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
 if(k==='lamp'){localStorage.setItem('lamp',v);document.documentElement.dataset.lamp=v}else A.set(k,+v)});
/* start up */
document.documentElement.dataset.lamp=localStorage.getItem('lamp')||'amber';
marks();setVol(volPct,true);
setTimeout(layout,50);setTimeout(layout,600);
$('needle').style.left='99%';setTimeout(()=>{$('needle').style.left='0%'},700);
setTimeout(()=>{$('disp').classList.remove('boot');booted=true},1700);
requestAnimationFrame(draw);poll();
</script></body></html>
