<style>

[data-t=u2]{--b1:#47474a;--b2:#101011;--w:#d11a2a;--wl:#fff;--c1:#222;--c2:#050505;--edge:#600;--s1:#f05060;--s2:#c8102e}

.ipod{position:relative}
html.hasbg,html.hasbg body{background:var(--bgimg) center/cover no-repeat,var(--page)!important}

#gba{position:fixed;inset:0;z-index:100;background:#0b0b0d;color:#fff;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);touch-action:none;font-family:-apple-system,Helvetica,Arial,sans-serif}
#gba[hidden]{display:none}

.gtop,.gbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px}
.gbar{justify-content:center}
#gtitle{opacity:.7;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gscr{position:relative;background:#000;width:100%;aspect-ratio:3/2}

.gl{display:flex;flex-direction:column;gap:8px;width:100%;max-height:100%;overflow:auto}
.gctl{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr auto;padding:6px 16px 10px}
.gsh{grid-column:1/3;display:flex;justify-content:space-between}

.gdp{position:relative;grid-row:2;justify-self:start;align-self:center;width:150px;height:150px;border-radius:50%;background:#1d1d22;touch-action:none}
.gdp b{position:absolute;width:44px;height:44px;line-height:44px;text-align:center;font-size:18px;color:#999;pointer-events:none}
.gdp b:nth-child(1){left:53px;top:6px}.gdp b:nth-child(2){left:6px;top:53px}.gdp b:nth-child(3){right:6px;top:53px}.gdp b:nth-child(4){left:53px;bottom:6px}

.gss{grid-column:1/3;display:flex;gap:18px;justify-content:center}
.gss button{height:34px;font-size:12px;letter-spacing:1px}
@media (orientation:landscape){
 #gba{flex-direction:row}.gtop{position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:3;background:#0008;border-radius:0 0 12px 12px}
 .gscr{position:absolute;inset:0;width:auto;aspect-ratio:auto}.gctl{position:absolute;inset:0;display:block;pointer-events:none;z-index:2}
 .gctl>*{position:absolute;pointer-events:auto}.gsh{left:12px;right:12px;top:6px;grid-column:auto;pointer-events:none}.gsh button{pointer-events:auto}
 .gdp{left:18px;bottom:14px}.gab{right:18px;bottom:14px}.gss{left:50%;bottom:6px;transform:translateX(-50%)}
 .gbar{position:absolute;bottom:44px;left:50%;transform:translateX(-50%);z-index:3}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;background:var(--page)}
body{display:flex;align-items:center;justify-content:center;font-family:-apple-system,Helvetica,Arial,sans-serif;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.ipod{width:var(--W);height:calc(var(--W)*1.667);padding:calc(var(--W)*.06);border-radius:calc(var(--W)*.09);background:linear-gradient(160deg,var(--b1),var(--b2));box-shadow:0 10px 40px #000a,inset 0 0 0 2px #fff6;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.screen{width:100%;height:42%;background:#111;border-radius:calc(var(--W)*.02);padding:calc(var(--W)*.02);box-shadow:inset 0 0 0 2px #888}
.lcd{position:relative;height:100%;background:var(--lcd);color:var(--fg);border-radius:2px;overflow:hidden;font-size:calc(var(--W)*.042)}
.bar{height:calc(var(--W)*.075);line-height:calc(var(--W)*.075);background:linear-gradient(var(--bar1),var(--bar2));color:#111;font-weight:700;text-align:center;border-bottom:1px solid #7a8aa0;font-size:.9em}
[data-t=night] .bar{color:#d6e4ff}
.add{position:absolute;right:0;top:0;width:calc(var(--W)*.1);height:calc(var(--W)*.075);line-height:calc(var(--W)*.07);text-align:center;font-weight:700;font-size:1.2em;color:#1f6fd0}
.row{height:calc(var(--W)*.08);line-height:calc(var(--W)*.08);padding:0 8px;white-space:nowrap;overflow:hidden;display:flex;justify-content:space-between;gap:8px}
.row span:first-child{overflow:hidden;text-overflow:ellipsis}
.row.sel{background:linear-gradient(var(--s1),var(--s2));color:#fff}
.cf{height:calc(var(--W)*.525)}
.stg{position:relative;height:calc(var(--W)*.36);perspective:calc(var(--W)*.8);-webkit-perspective:calc(var(--W)*.8)}
.cv{position:absolute;left:50%;top:calc(var(--W)*.025);display:flex;align-items:center;justify-content:center;background:#8886 center/cover no-repeat;font-size:2em;transition:transform .3s;-webkit-box-reflect:below 1px linear-gradient(transparent 55%,rgba(0,0,0,.3))}
.cap{margin-top:calc(var(--W)*-.045);text-align:center;position:relative;line-height:1.2;font-size:.85em;padding:0 6px}
.cap b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap span{display:block;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk{display:block;width:100%;height:calc(var(--W)*.525)}
.np{padding:calc(var(--W)*.04) 10px;display:flex;flex-direction:column;gap:calc(var(--W)*.03)}
.tp{display:flex;gap:10px;align-items:center}
.art{flex:none;width:calc(var(--W)*.3);height:calc(var(--W)*.3);border-radius:3px;background:#8884 center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:2.4em;opacity:.9;box-shadow:0 1px 4px #0006}
.meta{min-width:0;display:flex;flex-direction:column;gap:3px;font-size:.85em}
.meta b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.75}
.prog{height:9px;background:#ccc;border:1px solid #888;border-radius:5px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(var(--s1),var(--s2))}
.times{display:flex;justify-content:space-between;font-size:.8em;opacity:.75}
.wheel{position:relative;width:78%;aspect-ratio:1/1;border-radius:50%;background:var(--w);box-shadow:inset 0 0 0 1px var(--edge),0 1px 3px #0004;touch-action:none}
.wheel button{position:absolute;margin:0;padding:0;border:0;background:none;color:var(--wl);font:700 calc(var(--W)*.04) -apple-system,Helvetica,sans-serif;-webkit-appearance:none;appearance:none;display:flex;align-items:center;justify-content:center}
.wheel button:active{opacity:.45}
.wheel .t{top:3%;left:32%;width:36%;height:26%}.wheel .b{bottom:3%;left:32%;width:36%;height:26%}
.wheel .l{left:3%;top:32%;width:26%;height:36%}.wheel .r{right:3%;top:32%;width:26%;height:36%}
.wheel .c{left:32%;top:32%;width:36%;height:36%;border-radius:50%;background:linear-gradient(var(--c1),var(--c2));box-shadow:inset 0 0 0 1px var(--edge)}
.wheel .c:active{opacity:1;filter:brightness(.9)}
#pick,#pickBg,#pickStk,#pickRom{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0}
</style></head><body>
<div class="ipod">
 <div class="screen"><div class="lcd"><div class="bar" id="title">iPod</div><label for="pick" class="add">+</label><div id="list"></div></div></div>
 <div class="wheel" id="wheel">
  <button class="t" data-k="menu">MENU</button><button class="l" data-k="prev">&#9664;&#9664;</button>
  <button class="r" data-k="next">&#9654;&#9654;</button><button class="b" data-k="play">&#9654;&#10074;&#10074;</button>
  <button class="c" data-k="sel" aria-label="select"></button>
 </div>
 <div id="stk"></div>
</div>
<input type="file" id="pick" accept="audio/*,audio/mpeg,.mp3,.m4a,.aac,.wav,.flac,.ogg,.m3u,.m3u8,.pls,audio/x-mpegurl,application/vnd.apple.mpegurl" multiple>
<div id="gba" hidden>
 <div class="gtop"><button id="gexit">✕ Exit</button><span id="gtitle"></span><button id="gff">×1</button></div>
 <div class="gscr"><canvas id="gcv" width="240" height="160"></canvas><div id="gmsg"></div></div>
 <div class="gctl">
  <div class="gsh"><button data-b="l">L</button><button data-b="r">R</button></div>
  <div class="gdp" id="gdp"><b>▲</b><b>◀</b><b>▶</b><b>▼</b></div>
  <div class="gab"><button data-b="b">B</button><button data-b="a">A</button></div>
  <div class="gss"><button data-b="select">SELECT</button><button data-b="start">START</button></div>
 </div>
 <div class="gbar"><button id="gsave">Save state</button><button id="gload">Load state</button></div>
</div>
<input type="file" id="pickRom" accept=".gba,.gbc,.gb,.zip,.7z,application/zip,application/octet-stream">
<input type="file" id="pickBg" accept="image/*">
<input type="file" id="pickStk" accept="image/*" multiple>
<audio id="au" playsinline></audio>
<script>
const $=id=>document.getElementById(id),au=$('au');
const THEMES=[['classic','Classic White'],['black','Black'],['u2','U2 Red'],['pink','Pink'],['blue','Blue'],['night','Night'],['glass','Liquid Glass']];
let songs=[],cur=-1,stack=['main'],idx={main:0,songs:0,settings:0,themes:0,cf:0,games:0,music:0},cfl=[],queue=null,pls=[],plIds=[],plTitle='',albIds=[],albTitle='',cfMode='albums',stks=[],stkSel=-1,shuffle=false,theme='classic',lastDrag=0;
const fname=f=>f.name.replace(/\.[^.]+$/,'');
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function setTheme(t){theme=t;document.documentElement.dataset.t=t;try{localStorage.setItem('t',t)}catch(e){}}
try{setTheme(localStorage.getItem('t')||'classic')}catch(e){setTheme('classic')}
const scr=()=>stack[stack.length-1];
function items(s){
 if(s==='main')return['Music','Cover Flow','Now Playing','Shuffle Songs','Add Songs','Games','Settings'];
 if(s==='songs')return songs.length?songs.map(x=>x.title||x.n):['No songs - tap + to add'];
 if(s==='settings')return['Theme','Background','Stickers','Cover Flow: '+(cfMode==='songs'?'Songs':'Albums'),'Clear Library','Version 1.6.0'];
 if(s==='bgmenu')return['Choose Image','Remove Background'];
 if(s==='stkmenu')return['Add Sticker','Edit Stickers','Remove All'];
 if(s==='playlists')return pls.length?pls.map(p=>p.name+' ('+resolvePl(p).length+')'):['No playlists - add .m3u'];
 if(s==='plsongs')return plIds.length?plIds.map(i=>songs[i].title||songs[i].n):['No matching songs'];
 if(s==='album')return albIds.map(i=>songs[i].title||songs[i].n);
 if(s==='themes')return THEMES.map(x=>x[1]);if(s==='cf')return cfl.map(x=>x.t);if(s==='games')return['Brick','Pok\u00E9mon'];if(s==='music')return['Cover Flow','Playlists','Songs'];return[]}
function mark(s,i){if(['main','settings','music','games','bgmenu','stkmenu','playlists'].includes(s))return'\u203A';if(s==='songs')return i===cur?'\u266B':'';if(s==='album')return albIds[i]===cur?'\u266B':'';if(s==='plsongs')return plIds[i]===cur?'\u266B':'';if(s==='themes')return THEMES[i][0]===theme?'\u2713':'';return''}
function openCF(){if(songs.length){cfl=albums();idx.cf=curAlbum();stack.push('cf')}}
function albums(){const tr=x=>x.track||0,ttl=x=>x.title||x.n;
 if(cfMode==='songs')return songs.map((_,i)=>i).sort((a,b)=>(songs[a].album||'').localeCompare(songs[b].album||'')||tr(songs[a])-tr(songs[b])||ttl(songs[a]).localeCompare(ttl(songs[b])))
  .map(i=>{const x=songs[i];return{t:ttl(x),a:x.artist||x.album||'',art:x.art,i,ids:[i]}});
 const m=new Map(),o=[];songs.forEach((x,i)=>{const k=x.album?x.album+'|'+(x.artist||''):'s'+i;let g=m.get(k);if(!g){g={t:x.album||ttl(x),a:x.artist||'',art:x.art,i,ids:[]};m.set(k,g);o.push(g)}g.ids.push(i)});
 o.forEach(g=>{g.ids.sort((a,b)=>tr(songs[a])-tr(songs[b]));g.i=g.ids[0]});return o}
function curAlbum(){const j=cfl.findIndex(c=>c.ids.includes(cur));return j<0?0:j}
function renderCF(){const L=$('list');
 if(!L.querySelector('.cf')){L.innerHTML='<div class="cf"><div class="stg" id="stg"></div><div class="cap"><b id="cb"></b><span id="ca"></span></div></div>';
  $('stg').innerHTML=cfl.map((x,i)=>`<div class="cv" data-i="${i}"${x.art?` style="background-image:url('${x.art}')"`:''}>${x.art?'':'\u266B'}</div>`).join('')}
 const st=$('stg'),S=st.clientWidth*.36,i0=idx.cf||0;
 st.querySelectorAll('.cv').forEach((e,i)=>{const d=i-i0,a=Math.abs(d);
  if(a>5){e.style.display='none';return}
  const sg=Math.sign(d),x=d===0?0:sg*(S*.62+(a-1)*S*.2);
  e.style.display='flex';e.style.width=e.style.height=S+'px';e.style.marginLeft=-S/2+'px';
  e.style.transform=`translateX(${x}px) translateZ(${d===0?S*.3:-S*.2}px) rotateY(${d===0?0:-sg*58}deg)`;e.style.zIndex=10-a});
 const c=cfl[i0];$('cb').textContent=c?c.t:'';$('ca').textContent=c?[c.a,c.ids.length>1?c.ids.length+' songs':''].filter(Boolean).join(' \u00B7 '):''}
function syncStk(){const ed=scr()==='stk';$('stk').classList.toggle('edit',ed);if(!ed&&stkSel>=0){stkSel=-1;stkRender()}}
function render(){const s=scr(),L=$('list');syncStk();
 if(s==='stk'){$('title').textContent='Stickers';L.innerHTML='<div style="padding:10px;line-height:1.55">Drag to move<br>Pinch or spin wheel to resize<br>Double-tap to remove<br><span style="opacity:.7">Press MENU when done</span></div>';return}
 if(s==='cf'){$('title').textContent='Cover Flow';renderCF();return}
 if(s==='brick'){$('title').textContent='Brick';renderBrick();return}
 if(s==='np'){const t=songs[cur];$('title').textContent=(au.paused?'\u275A\u275A':'\u25B6')+' Now Playing';
  L.innerHTML=t?`<div class="np"><div class="tp"><div class="art"${t.art?` style="background-image:url('${t.art}')"`:''}>${t.art?'':'\u266B'}</div><div class="meta"><b>${esc(t.title||t.n)}</b><span>${esc(t.artist||'')}</span><span>${esc(t.album||'')}</span></div></div><div class="prog"><i id="pb"></i></div><div class="times"><span id="t1">0:00</span><span id="t2">-0:00</span></div></div>`:'<div class="np">Nothing playing</div>';tick();return}
 $('title').textContent={main:'iPod',music:'Music',games:'Games',songs:'Songs',settings:'Settings',themes:'Theme',bgmenu:'Background',stkmenu:'Stickers',playlists:'Playlists',plsongs:plTitle,album:albTitle}[s];
 const it=items(s),i=idx[s]||0,st=Math.max(0,Math.min(i-3,it.length-6));
 L.innerHTML=it.slice(st,st+6).map((x,k)=>`<div class="row${st+k===i?' sel':''}" data-i="${st+k}"><span>${esc(x)}</span><span>${mark(s,st+k)}</span></div>`).join('')}
const fmt=t=>{t=Math.max(0,t|0);return(t/60|0)+':'+String(t%60).padStart(2,'0')};
function tick(){const b=$('pb');if(!b)return;const d=au.duration||0;b.style.width=d?au.currentTime/d*100+'%':'0';$('t1').textContent=fmt(au.currentTime);$('t2').textContent='-'+fmt(d-au.currentTime)}
au.ontimeupdate=tick;au.onended=()=>next();au.onplay=au.onpause=()=>{if(scr()==='np')render()};
function media(t){if(!('mediaSession' in navigator))return;try{const m=navigator.mediaSession;m.metadata=new MediaMetadata({title:t.title||t.n,artist:t.artist||'iPod',album:t.album||'',artwork:t.art?[{src:t.art}]:[]});m.setActionHandler('play',()=>au.play());m.setActionHandler('pause',()=>au.pause());m.setActionHandler('previoustrack',prev);m.setActionHandler('nexttrack',next)}catch(e){}}
function play(i){const t=songs[i];if(!t)return;cur=i;au.src=t.u;au.play().catch(()=>{});media(t);render()}
const order=()=>queue||songs.map((_,i)=>i);
function next(){const o=order();if(!o.length)return;play(shuffle?o[Math.random()*o.length|0]:o[(o.indexOf(cur)+1)%o.length])}
function prev(){const o=order();if(!o.length)return;if(au.currentTime>3){au.currentTime=0;return}play(o[(o.indexOf(cur)-1+o.length)%o.length])}
function toggle(){if(cur<0&&songs.length){play(0);return}au.paused?au.play():au.pause()}
function select(){const s=scr(),i=idx[s]||0;
 if(s==='main'){const m=items('main')[i];
  if(m==='Music')stack.push('music');
  else if(m==='Cover Flow')openCF();

 if(pts.size>1&&gs.d0){s.w=Math.max(.04,Math.min(1.3,gs.w0*pdist()/gs.d0));if(gs.el)gs.el.style.width=s.w*100+'%'}
 else if(pts.size===1){const dx=(e.clientX-gs.sx)/r.width,dy=(e.clientY-gs.sy)/r.height;if(Math.abs(dx)+Math.abs(dy)>.012)gs.moved=true;
  if(gs.moved&&gs.el){s.x=Math.max(0,Math.min(1,gs.x0+dx));s.y=Math.max(0,Math.min(1,gs.y0+dy));gs.el.style.left=s.x*100+'%';gs.el.style.top=s.y*100+'%'}}},true);
const stkUp=e=>{if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);if(!gs)return;
 if(pts.size===0){const s=stks[gs.i];if(gs.moved){saveStk(s);lastDrag=Date.now()}else{const n=Date.now();if(lastTap.i===gs.i&&n-lastTap.t<350){lastTap.i=-1;if(confirm('Remove this sticker?'))delStk(gs.i)}else lastTap={i:gs.i,t:n}}gs=null}
 else if(pts.size===1){const s=stks[gs.i],p=[...pts.values()][0];gs.sx=p.x;gs.sy=p.y;gs.x0=s.x;gs.y0=s.y;gs.d0=0;lastDrag=Date.now()}};
document.addEventListener('pointerup',stkUp,true);document.addEventListener('pointercancel',stkUp,true);
document.addEventListener('gesturestart',e=>e.preventDefault());
let stkT=0;
function stkResize(d){const s=stks[stkSel];if(!s)return;s.w=Math.max(.04,Math.min(1.3,s.w*(1+d*.08)));const el=stkElOf(stkSel);if(el)el.style.width=s.w*100+'%';clearTimeout(stkT);stkT=setTimeout(()=>saveStk(s),400)}
async function loadAll(){await loadLib();try{pls=await rq((await store('readonly','playlists')).getAll())}catch(e){}
 try{const a=await rq((await store('readonly','stickers')).getAll());stks=a.map(r=>({id:r.id,b:r.b,u:URL.createObjectURL(r.b),x:r.x,y:r.y,w:r.w}));stkRender()}catch(e){}
 try{const b=await rq((await store('readonly','meta')).get('bg'));if(b)applyBg(b)}catch(e){}render()}
try{cfMode=localStorage.getItem('cfm')==='songs'?'songs':'albums'}catch(e){}
$('pick').onchange=async e=>{const fs=[...e.target.files];let n=0,p=0;for(const f of fs){if(/\.(m3u8?|pls)$/i.test(f.name))p+=await addPl(f);else n+=await addSong(f)}e.target.value='';
 if(fs.length){if(p&&!n)stack=['main','music','playlists'];else{stack=['main','songs'];idx.songs=Math.max(0,songs.length-n)}render()}};
// buttons + wheel
const acts={menu:back,prev,next,play:toggle,sel:select};
document.querySelectorAll('[data-k]').forEach(b=>b.addEventListener('click',()=>{if(Date.now()-lastDrag<350)return;acts[b.dataset.k]()}));
$('list').addEventListener('click',e=>{const c=e.target.closest('.cv');if(c){const i=+c.dataset.i;if(i===idx.cf)select();else{idx.cf=i;render()}return}const r=e.target.closest('.row');if(!r)return;idx[scr()]=+r.dataset.i;select()});
const w=$('wheel');let a0=null,acc=0,drag=false;
const ang=e=>{const r=w.getBoundingClientRect();return Math.atan2(e.clientY-r.top-r.height/2,e.clientX-r.left-r.width/2)};
w.addEventListener('pointerdown',e=>{if(gs)return;a0=ang(e);acc=0;drag=false});
w.addEventListener('pointermove',e=>{if(a0===null)return;const a=ang(e);let d=a-a0;if(d>Math.PI)d-=2*Math.PI;if(d<-Math.PI)d+=2*Math.PI;a0=a;acc+=d;if(scr()==='brick')bkMove(d);
 if(!drag&&Math.abs(acc)>.25){drag=true;try{w.setPointerCapture(e.pointerId)}catch(x){}}
 if(drag&&scr()!=='brick'&&Math.abs(acc)>.5){scroll(acc>0?1:-1);acc=0}});
const end=()=>{if(drag)lastDrag=Date.now();a0=null;drag=false};
w.addEventListener('pointerup',end);w.addEventListener('pointercancel',end);
render();loadAll();
